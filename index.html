<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>SYSTEM POS - Scanner Barcode</title>

  <!-- HTML5 QR Code Scanner -->

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }


    /* =====================================================
       BODY
    ===================================================== */

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #3b2418,
          #6b4226
        );

      color: #3b2418;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .scanner-container {

      width: 100%;

      max-width: 520px;

      background: #f8f1e8;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.35);

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {

      text-align: center;

      margin-bottom: 18px;

    }


    .title {

      font-size: 26px;

      font-weight: bold;

      letter-spacing: 0.5px;

      color: #3b2418;

    }


    .subtitle {

      font-size: 14px;

      color: #806957;

      margin-top: 6px;

    }


    /* =====================================================
       SCANNER
    ===================================================== */

    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 15px;

      background: #111;

      margin-top: 15px;

      min-height: 280px;

    }


    /*
      Memastikan elemen video scanner
      mengikuti ukuran container.
    */

    #reader video {

      width: 100% !important;

      height: auto !important;

      border-radius: 15px;

      object-fit: cover;

    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .buttons {

      display: flex;

      gap: 10px;

      margin-top: 15px;

    }


    button {

      flex: 1;

      border: none;

      border-radius: 10px;

      padding: 14px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;

    }


    button:active {

      transform: scale(0.98);

    }


    .btn-start {

      background: #6b4226;

      color: #fff;

    }


    .btn-stop {

      background: #ddd;

      color: #3b2418;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #eadcc9;

      text-align: center;

      font-size: 14px;

      min-height: 44px;

      display: flex;

      align-items: center;

      justify-content: center;

      line-height: 1.4;

    }


    /* =====================================================
       RESULT
    ===================================================== */

    .result {

      margin-top: 12px;

      padding: 14px;

      border-radius: 10px;

      background: #fff;

      border: 1px solid #d5c2ad;

      text-align: center;

    }


    .result-label {

      font-size: 12px;

      color: #806957;

      letter-spacing: 0.5px;

    }


    .result-value {

      margin-top: 5px;

      font-size: 24px;

      font-weight: bold;

      word-break: break-all;

      color: #3b2418;

    }


    /* =====================================================
       INFO
    ===================================================== */

    .info {

      margin-top: 15px;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

      color: #806957;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      body {

        padding: 10px;

      }


      .scanner-container {

        padding: 16px;

        border-radius: 16px;

      }


      .title {

        font-size: 23px;

      }


      .buttons {

        flex-direction: column;

      }


      button {

        width: 100%;

      }

    }

  </style>

</head>

<body>

  <div class="scanner-container">

```
<!-- =================================================
     HEADER
================================================= -->

<div class="header">

  <div class="title">

  </div>

  <div class="subtitle">

<div id="reader"></div>

<!-- =================================================

  </div>

<script>


  /* =====================================================
     PARAMETER DARI DAHAGA POS
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
    URL asal yang menerima hasil barcode.

    Contoh:
    ?targetOrigin=https://script.google.com
  */

  const targetOrigin =
    params.get("targetOrigin") || "*";


  /*
    Session dari halaman Kasir.
  */

  const sessionId =
    params.get("session") || "";



  /* =====================================================
     VARIABEL SCANNER
  ===================================================== */

  let html5QrCode = null;

  let sedangScan = false;

  let barcodeSudahTerbaca = false;



  /* =====================================================
     ELEMENT
  ===================================================== */

  const statusElement =
    document.getElementById("status");

  const hasilElement =
    document.getElementById("hasil");

  const btnStart =
    document.getElementById("btnStart");

  const btnStop =
    document.getElementById("btnStop");



  /* =====================================================
     MULAI SCAN
  ===================================================== */

  async function mulaiScan() {


    /*
      Jangan menjalankan scanner
      jika scanner sudah aktif.
    */

    if (sedangScan) {

      return;

    }


    barcodeSudahTerbaca = false;


    /*
      Bersihkan hasil sebelumnya.
    */

    hasilElement.textContent = "-";


    /*
      Status awal.
    */

    statusElement.textContent =
      "Meminta izin kamera...";


    try {


      /*
        Buat object scanner
        jika belum tersedia.
      */

      if (!html5QrCode) {

        html5QrCode =
          new Html5Qrcode("reader");

      }


      /*
        Konfigurasi scanner.
      */

      const config = {

        fps: 10,


        /*
          Area scan 70% dari ukuran
          kamera yang tersedia.
        */

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const ukuran =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70;


            return {

              width: ukuran,

              height: ukuran

            };

          },


        aspectRatio: 1.0,


        /*
          Meminta kamera belakang
          jika browser mendukung.
        */

        disableFlip: false

      };



      /* =================================================
         START CAMERA
      ================================================= */

      await html5QrCode.start(

        {
          facingMode: "environment"
        },

        config,

        ketikaBarcodeTerbaca,

        ketikaScanGagal

      );



      /* =================================================
         UPDATE STATUS
      ================================================= */

      sedangScan = true;

      btnStart.disabled = true;

      btnStop.disabled = false;


      statusElement.textContent =
        "Kamera aktif. Arahkan ke barcode menu.";


    }


    catch (error) {


      console.error(
        "Gagal membuka kamera:",
        error
      );


      sedangScan = false;

      btnStart.disabled = false;

      btnStop.disabled = true;


      statusElement.textContent =
        "Kamera tidak dapat digunakan.";


      /*
        Tampilkan informasi error.
      */

      alert(

        "Kamera tidak dapat digunakan.\n\n" +

        "Pastikan:\n\n" +

        "1. Browser mengizinkan kamera.\n" +

        "2. Scanner dibuka melalui HTTPS.\n" +

        "3. Kamera tidak sedang digunakan aplikasi lain.\n\n" +

        "Detail:\n" +

        error

      );

    }

  }



  /* =====================================================
     BARCODE BERHASIL TERBACA
  ===================================================== */

  async function ketikaBarcodeTerbaca(

    decodedText,

    decodedResult

  ) {


    /*
      Mencegah barcode yang sama
      diproses berkali-kali.
    */

    if (barcodeSudahTerbaca) {

      return;

    }


    barcodeSudahTerbaca = true;


    /*
      Bersihkan barcode.
    */

    const barcode =
      String(
        decodedText || ""
      ).trim();


    /*
      Jika kosong, izinkan scanner
      membaca kembali.
    */

    if (!barcode) {

      barcodeSudahTerbaca = false;

      return;

    }


    console.log(
      "Barcode terbaca:",
      barcode
    );


    /*
      Tampilkan barcode.
    */

    hasilElement.textContent =
      barcode;


    statusElement.textContent =
      "Barcode berhasil dibaca.";



    /* =================================================
       KIRIM HASIL KE HALAMAN KASIR
    ================================================= */

    try {


      /*
        Pastikan halaman Kasir
        masih membuka scanner.
      */

      if (

        window.opener &&

        !window.opener.closed

      ) {


        window.opener.postMessage(

          {

            source:
              "DAHAGA_BARCODE_SCANNER",


            type:
              "BARCODE_RESULT",


            barcode:
              barcode,


            session:
              sessionId,


            waktu:
              Date.now()

          },


          targetOrigin

        );


        console.log(
          "Barcode berhasil dikirim ke Kasir."
        );


      }


      else {


        alert(

          "Halaman Kasir tidak ditemukan.\n\n" +

          "Silakan buka scanner dari tombol SCAN di Kasir."

        );

      }


    }


    catch (error) {


      console.error(
        "Gagal mengirim barcode:",
        error
      );


      alert(

        "Barcode berhasil dibaca, " +

        "tetapi gagal dikirim ke Kasir."

      );

    }



    /* =================================================
       STOP CAMERA
    ================================================= */

    await berhentiScan();



    /* =================================================
       TUTUP SCANNER
    ================================================= */

    setTimeout(

      function() {

        try {

          window.close();

        }

        catch (error) {

          console.log(
            "Window close:",
            error
          );

        }

      },

      700

    );

  }



  /* =====================================================
     ERROR SCAN
  ===================================================== */

  function ketikaScanGagal(

    errorMessage

  ) {


    /*
      Tidak menampilkan error
      setiap frame.

      Scanner memang akan terus mencoba
      membaca barcode sampai berhasil.
    */

  }



  /* =====================================================
     STOP SCANNER
  ===================================================== */

  async function berhentiScan() {


    /*
      Jika scanner sedang aktif,
      hentikan kamera.
    */

    if (

      html5QrCode &&

      sedangScan

    ) {


      try {


        await html5QrCode.stop();


      }


      catch (error) {


        console.error(

          "Gagal menghentikan scanner:",

          error

        );

      }

    }


    /*
      Update status scanner.
    */

    sedangScan = false;

    btnStart.disabled = false;

    btnStop.disabled = true;


    /*
      Jangan mengganti status
      jika barcode baru saja terbaca.
    */

    if (!barcodeSudahTerbaca) {

      statusElement.textContent =
        "Scanner dihentikan.";

    }

  }



  /* =====================================================
     CLEANUP SAAT HALAMAN DITUTUP
  ===================================================== */

  window.addEventListener(
    "beforeunload",
    async function() {

      if (

        html5QrCode &&

        sedangScan

      ) {

        try {

          await html5QrCode.stop();

        }

        catch (error) {

          console.log(
            "Cleanup scanner:",
            error
          );

        }

      }

    }
  );


</script>
