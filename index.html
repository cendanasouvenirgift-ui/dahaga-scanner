<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>DAHAGA POS - Scanner Barcode</title>

  <!--
    HTML5 QR Code
  -->

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }


    /* =====================================================
       BODY
    ===================================================== */

    html,
    body {

      width: 100%;

      min-height: 100%;

      margin: 0;

      padding: 0;

    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #3b2418,
          #6b4226
        );

      color: #3b2418;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .scanner-container {

      width: 100%;

      max-width: 520px;

      background: #f8f1e8;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.35);

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {

      text-align: center;

      margin-bottom: 18px;

    }


    .title {

      font-size: 26px;

      font-weight: bold;

      color: #3b2418;

      letter-spacing: 0.5px;

    }


    .subtitle {

      margin-top: 6px;

      font-size: 14px;

      color: #806957;

    }


    /* =====================================================
       READER
    ===================================================== */

    #reader {

      width: 100%;

      min-height: 280px;

      overflow: hidden;

      position: relative;

      border-radius: 15px;

      background: #111;

      margin-top: 15px;

    }


    /*
      Jangan menggunakan height:auto pada video.
      Beberapa browser dapat menyebabkan preview hitam.
    */

    #reader video {

      display: block;

      width: 100% !important;

      max-width: 100% !important;

      border-radius: 15px;

    }


    /*
      Canvas hasil scanner.
    */

    #reader canvas {

      max-width: 100% !important;

    }


    /*
      Hilangkan beberapa elemen bawaan
      yang tidak diperlukan.
    */

    #reader img {

      max-width: 100%;

    }


    /* =====================================================
       BUTTON
    ===================================================== */

    .buttons {

      display: flex;

      gap: 10px;

      margin-top: 15px;

    }


    button {

      flex: 1;

      border: none;

      border-radius: 10px;

      padding: 14px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.1s ease,
        opacity 0.2s ease;

    }


    button:active {

      transform: scale(0.98);

    }


    .btn-start {

      background: #6b4226;

      color: #fff;

    }


    .btn-stop {

      background: #ddd;

      color: #3b2418;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;

    }


    /* =====================================================
       CAMERA SELECT
    ===================================================== */

    .camera-box {

      display: none;

      margin-top: 12px;

    }


    .camera-label {

      display: block;

      margin-bottom: 6px;

      font-size: 12px;

      font-weight: bold;

      color: #806957;

    }


    #cameraSelect {

      width: 100%;

      padding: 11px;

      border-radius: 9px;

      border: 1px solid #d5c2ad;

      background: #fff;

      color: #3b2418;

      font-size: 14px;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #eadcc9;

      text-align: center;

      font-size: 14px;

      line-height: 1.4;

      min-height: 44px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =====================================================
       RESULT
    ===================================================== */

    .result {

      margin-top: 12px;

      padding: 14px;

      border-radius: 10px;

      background: #fff;

      border: 1px solid #d5c2ad;

      text-align: center;

    }


    .result-label {

      font-size: 12px;

      color: #806957;

      letter-spacing: 0.5px;

    }


    .result-value {

      margin-top: 5px;

      font-size: 24px;

      font-weight: bold;

      color: #3b2418;

      word-break: break-all;

    }


    /* =====================================================
       INFO
    ===================================================== */

    .info {

      margin-top: 15px;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

      color: #806957;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      body {

        padding: 10px;

      }


      .scanner-container {

        padding: 16px;

        border-radius: 16px;

      }


      .title {

        font-size: 23px;

      }


      .buttons {

        flex-direction: column;

      }


      button {

        width: 100%;

      }

    }

  </style>

</head>

<body>

  <div class="scanner-container">

```
<!-- =================================================
     HEADER
================================================= -->

<div class="header">

  <div class="title">
    SYSTEM POS
  </div>

  <div class="subtitle">
    Scanner Barcode Menu
  </div>

</div>


<!-- =================================================
     CAMERA READER
================================================= -->

<div id="reader"></div>


<!-- =================================================
     CAMERA SELECT
================================================= -->

<div
  id="cameraBox"
  class="camera-box"
>

  <label
    class="camera-label"
    for="cameraSelect"
  >
    PILIH KAMERA
  </label>


  <select
    id="cameraSelect"
    onchange="gantiKamera()"
  >

  </select>

</div>


<!-- =================================================
     BUTTONS
================================================= -->

<div class="buttons">

  <button
    id="btnStart"
    class="btn-start"
    onclick="mulaiScan()"
  >
    MULAI SCAN
  </button>


  <button
    id="btnStop"
    class="btn-stop"
    onclick="berhentiScan()"
    disabled
  >
    STOP
  </button>

</div>


<!-- =================================================
     STATUS
================================================= -->

<div
  id="status"
  class="status"
>
  Tekan "MULAI SCAN" untuk menggunakan kamera.
</div>


<!-- =================================================
     RESULT
================================================= -->

<div class="result">

  <div class="result-label">
    BARCODE TERBACA
  </div>


  <div
    id="hasil"
    class="result-value"
  >
    -
  </div>

</div>


<!-- =================================================
     INFO
================================================= -->

<div class="info">

  Arahkan kamera ke barcode menu SYSTEM POS.

  <br>

  Setelah barcode terbaca, hasil akan dikirim
  kembali ke halaman Kasir.

</div>
```

  </div>

<script>


  /* =====================================================
     PARAMETER DARI DAHAGA POS
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
    Origin tujuan untuk postMessage.
  */

  const targetOrigin =
    params.get("targetOrigin") || "*";


  /*
    Session dari halaman Kasir.
  */

  const sessionId =
    params.get("session") || "";



  /* =====================================================
     ELEMENT
  ===================================================== */

  const statusElement =
    document.getElementById("status");


  const hasilElement =
    document.getElementById("hasil");


  const btnStart =
    document.getElementById("btnStart");


  const btnStop =
    document.getElementById("btnStop");


  const cameraBox =
    document.getElementById("cameraBox");


  const cameraSelect =
    document.getElementById("cameraSelect");



  /* =====================================================
     VARIABEL
  ===================================================== */

  let html5QrCode = null;

  let sedangScan = false;

  let barcodeSudahTerbaca = false;

  let cameras = [];

  let cameraIdAktif = null;



  /* =====================================================
     HELPER STATUS
  ===================================================== */

  function setStatus(pesan) {

    statusElement.textContent =
      pesan;

  }



  /* =====================================================
     MENCARI KAMERA
  ===================================================== */

  async function ambilDaftarKamera() {

    try {

      setStatus(
        "Meminta izin kamera..."
      );


      /*
        Meminta izin kamera terlebih dahulu.

        getUserMedia diperlukan agar browser
        memberikan label kamera pada beberapa
        perangkat.
      */

      const stream =
        await navigator.mediaDevices.getUserMedia(
          {
            video: true,
            audio: false
          }
        );


      /*
        Setelah izin diberikan,
        hentikan stream sementara.

        HTML5 QR Code akan membuka kamera
        kembali saat scanner dimulai.
      */

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      /*
        Ambil daftar kamera.
      */

      cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "Kamera tidak ditemukan."
        );

      }


      /*
        Bersihkan dropdown.
      */

      cameraSelect.innerHTML = "";


      /*
        Tambahkan semua kamera.
      */

      cameras.forEach(

        function(camera, index) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            camera.id;


          option.textContent =
            camera.label ||
            "Kamera " + (index + 1);


          cameraSelect.appendChild(
            option
          );

        }

      );


      /*
        Cari kamera belakang.

        Biasanya label kamera berisi:
        - back
        - rear
        - environment
        - belakang
      */

      const kameraBelakang =
        cameras.find(

          function(camera) {

            const label =
              String(
                camera.label || ""
              ).toLowerCase();


            return (

              label.includes("back") ||

              label.includes("rear") ||

              label.includes("environment") ||

              label.includes("belakang")

            );

          }

        );


      /*
        Pilih kamera belakang
        jika ditemukan.

        Jika tidak ditemukan,
        gunakan kamera pertama.
      */

      if (kameraBelakang) {

        cameraIdAktif =
          kameraBelakang.id;

      }

      else {

        cameraIdAktif =
          cameras[0].id;

      }


      cameraSelect.value =
        cameraIdAktif;


      /*
        Tampilkan pilihan kamera
        jika terdapat lebih dari satu.
      */

      if (cameras.length > 1) {

        cameraBox.style.display =
          "block";

      }

      else {

        cameraBox.style.display =
          "none";

      }


      return cameraIdAktif;

    }


    catch (error) {

      console.error(
        "Gagal mendapatkan kamera:",
        error
      );


      throw error;

    }

  }



  /* =====================================================
     MULAI SCAN
  ===================================================== */

  async function mulaiScan() {


    if (sedangScan) {

      return;

    }


    barcodeSudahTerbaca = false;

    hasilElement.textContent = "-";


    btnStart.disabled = true;

    btnStop.disabled = true;


    try {


      /*
        Pastikan library tersedia.
      */

      if (
        typeof Html5Qrcode ===
        "undefined"
      ) {

        throw new Error(
          "Library scanner tidak berhasil dimuat."
        );

      }


      /*
        Buat instance scanner
        jika belum ada.
      */

      if (!html5QrCode) {

        html5QrCode =
          new Html5Qrcode(
            "reader"
          );

      }


      /*
        Cari kamera.
      */

      const cameraId =
        await ambilDaftarKamera();


      cameraIdAktif =
        cameraId;


      setStatus(
        "Menyalakan kamera..."
      );


      /*
        Konfigurasi scanner.

        qrbox menggunakan ukuran relatif
        terhadap preview kamera.
      */

      const config = {

        fps: 10,


        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const ukuran =
              Math.floor(

                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                ) * 0.70

              );


            return {

              width:
                ukuran,

              height:
                ukuran

            };

          },


        aspectRatio: 1.0,


        disableFlip: false

      };


      /*
        Mulai kamera menggunakan cameraId.

        Ini lebih stabil dibanding langsung
        menggunakan facingMode.
      */

      await html5QrCode.start(

        cameraIdAktif,

        config,

        ketikaBarcodeTerbaca,

        ketikaScanGagal

      );


      /*
        Scanner berhasil aktif.
      */

      sedangScan = true;

      btnStart.disabled = true;

      btnStop.disabled = false;


      setStatus(
        "Kamera aktif. Arahkan ke barcode menu."
      );


    }


    catch (error) {


      console.error(
        "Gagal membuka kamera:",
        error
      );


      sedangScan = false;

      btnStart.disabled = false;

      btnStop.disabled = true;


      let pesan =
        "Kamera tidak dapat digunakan.";


      /*
        Informasi error yang lebih
        mudah dipahami.
      */

      if (
        error &&
        error.message
      ) {

        pesan =
          error.message;

      }


      setStatus(
        "Kamera gagal dibuka."
      );


      alert(

        "Kamera tidak dapat digunakan.\n\n" +

        "Periksa hal berikut:\n\n" +

        "1. Izinkan akses kamera pada browser.\n" +

        "2. Pastikan scanner dibuka melalui HTTPS.\n" +

        "3. Pastikan kamera tidak sedang digunakan aplikasi lain.\n" +

        "4. Jika menggunakan HP, gunakan browser Chrome.\n\n" +

        "Detail:\n" +

        pesan

      );

    }

  }



  /* =====================================================
     GANTI KAMERA
  ===================================================== */

  async function gantiKamera() {


    const cameraIdBaru =
      cameraSelect.value;


    if (!cameraIdBaru) {

      return;

    }


    cameraIdAktif =
      cameraIdBaru;


    /*
      Jika scanner sedang berjalan,
      hentikan lalu mulai menggunakan
      kamera baru.
    */

    if (sedangScan) {


      try {


        await html5QrCode.stop();


      }


      catch (error) {


        console.error(
          "Gagal menghentikan kamera:",
          error
        );

      }


      sedangScan = false;


      try {

        const config = {

          fps: 10,

          qrbox:
            function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const ukuran =
                Math.floor(

                  Math.min(
                    viewfinderWidth,
                    viewfinderHeight
                  ) * 0.70

                );


              return {

                width:
                  ukuran,

                height:
                  ukuran

              };

            },

          aspectRatio: 1.0,

          disableFlip: false

        };


        await html5QrCode.start(

          cameraIdAktif,

          config,

          ketikaBarcodeTerbaca,

          ketikaScanGagal

        );


        sedangScan = true;


        setStatus(
          "Kamera berhasil diganti."
        );


      }


      catch (error) {


        console.error(
          "Gagal mengganti kamera:",
          error
        );


        sedangScan = false;


        setStatus(
          "Gagal mengganti kamera."
        );

      }

    }

  }



  /* =====================================================
     BARCODE TERBACA
  ===================================================== */

  async function ketikaBarcodeTerbaca(

    decodedText,

    decodedResult

  ) {


    /*
      Mencegah barcode diproses
      berkali-kali.
    */

    if (barcodeSudahTerbaca) {

      return;

    }


    barcodeSudahTerbaca = true;


    /*
      Bersihkan hasil barcode.
    */

    const barcode =
      String(
        decodedText || ""
      ).trim();


    /*
      Jika barcode kosong,
      izinkan scanner mencoba lagi.
    */

    if (!barcode) {

      barcodeSudahTerbaca = false;

      return;

    }


    console.log(
      "Barcode terbaca:",
      barcode
    );


    /*
      Tampilkan hasil.
    */

    hasilElement.textContent =
      barcode;


    setStatus(
      "Barcode berhasil dibaca."
    );



    /* =================================================
       KIRIM KE HALAMAN KASIR
    ================================================= */

    try {


      if (

        window.opener &&

        !window.opener.closed

      ) {


        window.opener.postMessage(

          {

            source:
              "DAHAGA_BARCODE_SCANNER",


            type:
              "BARCODE_RESULT",


            barcode:
              barcode,


            session:
              sessionId,


            waktu:
              Date.now()

          },


          targetOrigin

        );


        console.log(
          "Barcode berhasil dikirim ke Kasir."
        );


      }


      else {


        alert(

          "Halaman Kasir tidak ditemukan.\n\n" +

          "Silakan buka scanner dari tombol SCAN di Kasir."

        );

      }

    }


    catch (error) {


      console.error(
        "Gagal mengirim barcode:",
        error
      );


      alert(

        "Barcode berhasil dibaca,\n" +

        "tetapi gagal dikirim ke Kasir."

      );

    }



    /* =================================================
       STOP CAMERA
    ================================================= */

    await berhentiScan();



    /* =================================================
       TUTUP WINDOW
    ================================================= */

    setTimeout(

      function() {

        try {

          window.close();

        }

        catch (error) {

          console.log(
            "Window close:",
            error
          );

        }

      },

      700

    );

  }



  /* =====================================================
     ERROR SCAN
  ===================================================== */

  function ketikaScanGagal(

    errorMessage

  ) {

    /*
      Jangan mengubah status setiap frame.

      Scanner memang akan terus mencoba
      membaca barcode.
    */

  }



  /* =====================================================
     STOP SCANNER
  ===================================================== */

  async function berhentiScan() {


    if (

      html5QrCode &&

      sedangScan

    ) {


      try {


        await html5QrCode.stop();


      }


      catch (error) {


        console.error(
          "Gagal menghentikan scanner:",
          error
        );

      }

    }


    sedangScan = false;


    btnStart.disabled = false;

    btnStop.disabled = true;


    if (!barcodeSudahTerbaca) {

      setStatus(
        "Scanner dihentikan."
      );

    }

  }



  /* =====================================================
     CLEANUP
  ===================================================== */

  window.addEventListener(

    "beforeunload",

    function() {


      if (

        html5QrCode &&

        sedangScan

      ) {


        html5QrCode
          .stop()
          .catch(

            function(error) {

              console.log(
                "Cleanup scanner:",
                error
              );

            }

          );

      }

    }

  );


</script>
